<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 外层钻石结构的圆形pad（四个角） -->
  <circle cx="50" cy="10" r="7" fill="#00FFFF" stroke="white" stroke-width="1.5"/>
  <circle cx="90" cy="50" r="7" fill="#00FFFF" stroke="white" stroke-width="1.5"/>
  <circle cx="50" cy="90" r="7" fill="#00FFFF" stroke="white" stroke-width="1.5"/>
  <circle cx="10" cy="50" r="7" fill="#00FFFF" stroke="white" stroke-width="1.5"/>
  
  <!-- 顶部右侧和底部左侧的双线（较粗，平行线） -->
  <!-- 第一条线 -->
  <path d="M 50 10 L 90 50" stroke="#00FFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 50 10 L 90 50" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- 第二条平行线 -->
  <path d="M 47 13 L 87 53" stroke="#00FFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 47 13 L 87 53" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- 底部左侧的双线 -->
  <path d="M 10 50 L 50 90" stroke="#00FFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 10 50 L 50 90" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 13 50 L 53 90" stroke="#00FFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 13 50 L 53 90" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- 顶部左侧和底部右侧的单线（较细） -->
  <path d="M 10 50 L 50 10" stroke="#00FFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 10 50 L 50 10" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 90 50 L 50 90" stroke="#00FFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 90 50 L 50 90" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- 内部Z字形元素（N字形） -->
  <path d="M 32 32 L 68 32 L 32 68 L 68 68" stroke="#00FFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 32 32 L 68 32 L 32 68 L 68 68" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
  
  <!-- 内部Z字形元素的小圆形pad -->
  <circle cx="32" cy="32" r="3.5" fill="#00FFFF" stroke="white" stroke-width="1.2"/>
  <circle cx="68" cy="68" r="3.5" fill="#00FFFF" stroke="white" stroke-width="1.2"/>
</svg>

